spring.application.name=soa
spring.datasource.url=jdbc:mysql://localhost:3306/soa?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Lima
spring.datasource.username=soauser
spring.datasource.password=soapassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
